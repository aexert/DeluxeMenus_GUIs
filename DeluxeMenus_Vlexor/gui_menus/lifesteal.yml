#  Exert's DeluxeMenus Lifesteal Guide Menu
#=========================================================
menu_title: '&7ʟɪғᴇsᴛᴇᴀʟ ɢᴜɪᴅᴇ'
open_command:
  - lifestealguide
register_command: true
size: 27
items:

  'info':
    material: WRITABLE_BOOK
    slot: 13
    display_name: '&#ff4444What is Lifesteal?'
