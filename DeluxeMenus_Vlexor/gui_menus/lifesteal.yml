  '1':
    material: RED_DYE
    slot: 11
    display_name: '&#ff0000Heart'
    lore:
      - '&8Click to unlock the recipe'
      - ''
      - '&7Craft this item to gain an extra heart.'
    enchantments:
      - DURABILITY;1
    hide_enchantments: true
    hide_attributes: true
    click_commands:
      - '[sound] ENTITY_EXPERIENCE_ORB_PICKUP'
      - '[console] recipe give %player_name% lifestealcore:heart'
