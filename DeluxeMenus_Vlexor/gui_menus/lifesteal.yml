      - DURABILITY;1
    hide_enchantments: true
    hide_attributes: true
    click_commands:
      - '[sound] ENTITY_EXPERIENCE_ORB_PICKUP'
      - '[console] recipe give %player_name% lifestealcore:revie_beacon'
