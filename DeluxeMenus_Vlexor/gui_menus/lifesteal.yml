  '3':
    material: BARRIER
    slot: 26
    display_name: '&#FF5555ᴄʟᴏsᴇ'
    lore:
      - '&8Click to exit'
    click_commands:
      - '[sound] BLOCK_CHEST_CLOSE'
      - '[close]'
