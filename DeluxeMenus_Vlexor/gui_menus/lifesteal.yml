      - '&7▶ &fKill players to steal their hearts.'
      - '&7▶ &fCraft extra hearts and store them.'
      - ''
      - '&c● &fMax Hearts: &c20 default (can increase)'
      - '&c● &fHeart Loss: -1 on death'
      - '&c● &fHeart Gain: +1 on kill'
      - ''
      - '&fCraft special items to support survival.'
